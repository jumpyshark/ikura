name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Select current Xcode
    uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: latest-stable

  - name: Show Xcode and Swift versions
    run: |
      xcodebuild -version
      swift --version

  - name: Set up Node
    uses: actions/setup-node@v5
    with:
      node-version: 22
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Generate iOS project
    run: CI=1 npx expo prebuild --platform ios

  - name: Install CocoaPods
    run: npx pod-install
      - name: Build unsigned device app
        shell: bash
        run: |
          WORKSPACE_PATH="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME_NAME="$(basename "$WORKSPACE_PATH" .xcworkspace)"

          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "iOS app was not found"
            exit 1
          fi

          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ReceiptLog-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptLog-unsigned-ios
          path: ReceiptLog-unsigned.ipa
          retention-days: 14