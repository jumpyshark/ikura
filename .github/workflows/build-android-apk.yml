name: Build Android APK

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: Verify TypeScript and receipt parser
        run: |
          npm run typecheck
          npm run test:parser

      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package APK artifact
        run: |
          APK_PATH="$(find android/app/build/outputs/apk -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "Compiled Android APK was not found"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p output
          cp "$APK_PATH" output/ReceiptLog.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptLog-android-apk
          path: output/ReceiptLog.apk
          if-no-files-found: error
          retention-days: 14
